name: SpiderwebFSKit

options:
  deploymentTarget:
    macOS: "15.4"

settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Mac Developer"
    DEVELOPMENT_TEAM: H6PZ8M39DM
    ENABLE_APP_SANDBOX: YES
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  SpiderwebFSKit:
    type: application
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: Sources/Shared
      - path: Sources/SpiderwebFSKitApp
    info:
      path: Config/SpiderwebFSKit-Info.plist
      properties:
        CFBundleDisplayName: SpiderwebFSKit
        LSUIElement: true
        NSSystemExtensionUsageDescription: SpiderwebFSKit installs a file system extension to mount Spiderweb workspaces.
    entitlements:
      path: Config/SpiderwebFSKit.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deanoc.spiderweb.fskit.app
        PRODUCT_NAME: SpiderwebFSKit
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: SpiderwebFSKitExtension
        embed: true
        codeSign: true

  SpiderwebFSKitExtension:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: Sources/Shared
      - path: Sources/SpiderwebFSKitExtension
    info:
      path: Config/SpiderwebFSKitExtension-Info.plist
      properties:
        CFBundleDisplayName: SpiderwebFSKitExtension
        CFBundlePackageType: XPC!
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSActivateOptionSyntax:
            shortOptions: "u:g:m:o:"
          FSCheckOptionSyntax:
            shortOptions: "nqy"
          FSFormatOptionSyntax:
            shortOptions: "v"
          FSMediaTypes: {}
          FSPersonalities: {}
          FSRequiresSecurityScopedPathURLResources: true
          FSShortName: spiderwebnative
          FSSupportsBlockResources: false
          FSSupportsPathURLs: true
    entitlements:
      path: Config/SpiderwebFSKitExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deanoc.spiderweb.fskit.app.extension
        PRODUCT_NAME: SpiderwebFSKitExtension
        GENERATE_INFOPLIST_FILE: NO
